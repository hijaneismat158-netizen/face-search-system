<!DOCTYPE html>
<html>
<head>
  <title>Face Search System</title>
</head>

<body>

<h1>🔍 Face Search System</h1>

<input type="file" id="uploadInput" />

<div>
  <h3>Results</h3>
  <div id="results"></div>
</div>

<!-- face-api.js CDN -->
<script defer src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>

<script>
const imageDatabase = [
  "https://drive.google.com/uc?export=view&id=FILE_ID_1",
  "https://drive.google.com/uc?export=view&id=FILE_ID_2"
];

let labeledDescriptors = [];

Promise.all([
  faceapi.nets.ssdMobilenetv1.loadFromUri('./models'),
  faceapi.nets.faceLandmark68Net.loadFromUri('./models'),
  faceapi.nets.faceRecognitionNet.loadFromUri('./models')
]).then(startSystem);

async function startSystem() {
  console.log("Models Loaded");

  for (let imgUrl of imageDatabase) {
    try {
      const img = await faceapi.fetchImage(imgUrl);

      const detection = await faceapi
        .detectSingleFace(img)
        .withFaceLandmarks()
        .withFaceDescriptor();

      if (detection) {
        labeledDescriptors.push({
          url: imgUrl,
          descriptor: detection.descriptor
        });
      }

    } catch (err) {
      console.log("Error:", imgUrl);
    }
  }

  console.log("Database Ready");
}

document.getElementById("uploadInput").addEventListener("change", async function () {

  const file = this.files[0];
  const img = await faceapi.bufferToImage(file);

  const detection = await faceapi
    .detectSingleFace(img)
    .withFaceLandmarks()
    .withFaceDescriptor();

  if (!detection) {
    alert("No face detected!");
    return;
  }

  const queryDescriptor = detection.descriptor;

  let results = [];

  for (let item of labeledDescriptors) {
    const distance = faceapi.euclideanDistance(queryDescriptor, item.descriptor);

    if (distance < 0.6) {
      results.push(item.url);
    }
  }

  showResults(results);
});

function showResults(images) {
  const container = document.getElementById("results");
  container.innerHTML = "";

  if (images.length === 0) {
    container.innerHTML = "<p>No match found</p>";
    return;
  }

  images.forEach(url => {
    const img = document.createElement("img");
    img.src = url;
    img.width = 150;
    container.appendChild(img);
  });
}
</script>

</body>
</html>
